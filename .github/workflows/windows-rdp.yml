name: Windows RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP
      run: |
        Write-Host "Enabling RDP..." -ForegroundColor Green
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

    - name: Create User
      run: |
        Write-Host "Creating user..." -ForegroundColor Green
        $Password = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin"

    - name: Setup ngrok
      env:
        NGROK_TOKEN: ${{ secrets.NGROK_SHAHZAIB }}
      run: |
        Write-Host "Setting up ngrok..." -ForegroundColor Green
        
        # ngrok indir
        Write-Host "Downloading ngrok..." -ForegroundColor Yellow
        Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
        Expand-Archive -Path "ngrok.zip" -DestinationPath "."
        
        # ngrok auth
        if ($env:NGROK_TOKEN) {
          Write-Host "Authenticating ngrok..." -ForegroundColor Yellow
          .\ngrok.exe authtoken $env:NGROK_TOKEN
          Write-Host "ngrok authenticated!" -ForegroundColor Green
        } else {
          Write-Host "No ngrok token!" -ForegroundColor Red
          exit 1
        }
        
        # ngrok tunnel başlat
        Write-Host "Starting ngrok tunnel..." -ForegroundColor Yellow
        Start-Process -NoNewWindow -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout"
        
        # ngrok URL'yi al
        Write-Host "Waiting for ngrok tunnel..." -ForegroundColor Yellow
        Start-Sleep -Seconds 20
        
        try {
          $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
          $ngrokUrl = $response.tunnels[0].public_url
          
          Write-Host "`n========================================" -ForegroundColor Cyan
          Write-Host "RDP CONNECTION INFO:" -ForegroundColor Green
          Write-Host "Host: $ngrokUrl" -ForegroundColor Green
          Write-Host "Username: runneradmin" -ForegroundColor Green
          Write-Host "Password: P@ssw0rd!" -ForegroundColor Green
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "Session lasts 6 hours" -ForegroundColor Yellow
        } catch {
          Write-Host "Failed to get ngrok URL" -ForegroundColor Red
          exit 1
        }

    - name: Keep Alive
      run: |
        Write-Host "Keeping alive..." -ForegroundColor Green
        while ($true) { Start-Sleep 60 }

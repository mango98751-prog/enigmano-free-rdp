name: Windows RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP
      run: |
        Write-Host "Enabling RDP..." -ForegroundColor Green
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

    - name: Create User
      run: |
        Write-Host "Creating user..." -ForegroundColor Green
        $Password = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin"

    - name: Setup Cloudflare Tunnel
      run: |
        Write-Host "Downloading Cloudflare Tunnel..." -ForegroundColor Yellow
        Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"
        
        Write-Host "Starting Cloudflare Tunnel..." -ForegroundColor Yellow
        Start-Process -NoNewWindow -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url rdp://localhost:3389"
        
        Start-Sleep -Seconds 10
        
        Write-Host "`n========================================" -ForegroundColor Cyan
        Write-Host "RDP CONNECTION INFO:" -ForegroundColor Green
        Write-Host "Cloudflare Tunnel is running!" -ForegroundColor Green
        Write-Host "Username: runneradmin" -ForegroundColor Green
        Write-Host "Password: P@ssw0rd!" -ForegroundColor Green
        Write-Host "========================================" -ForegroundColor Cyan

    - name: Keep Alive
      run: |
        Write-Host "Keeping alive..." -ForegroundColor Green
        while ($true) { Start-Sleep 60 }

